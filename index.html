<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Open Tuna Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e3a52'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='15' text-anchor='middle' fill='%237fe3ff'%3EOt%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- The studio's start screen (like an Adobe app's Home): new / open / recent projects and the demos.
     Needs the studio server (tools/serve.py) to create or open projects; without one (GitHub Pages) it says so and
     only plays the demos (listed in demos/index.json). Old story links (?t= ?p= ?lab ?edit) are redirected. -->
<script>
  // links from before the studio had a home page: /?t=… /?p=… (the Thai Union site), /?edit, /?lab
  (() => {
    const q = new URLSearchParams(location.search);
    const id = q.get('project') || 'demo/thai-union';
    q.delete('project');
    if (q.has('edit')) { q.delete('edit'); location.replace(`editor.html?project=${id}${q.size ? `&${q}` : ''}`); }
    else if (q.has('lab')) location.replace(`play.html?${q}`);
    else if (q.size || new URLSearchParams(location.search).has('project')) location.replace(`play.html?project=${id}${q.size ? `&${q}` : ''}`);
  })();
</script>
<style>
  :root {
    --bg: #1b1d22; --rail: #141619; --panel: #23262c; --panel2: #2b2f36; --line: #31353d; --line2: #444a54;
    --text: #e3e7ee; --dim: #9aa2ae; --faint: #646c78; --accent: #4fb8ff; --accent2: #2d8fd6; --good: #4cd17a; --warn: #f5c542;
    --tile: linear-gradient(140deg, #0f4c6c, #0a2a3d 60%, #06151f);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 Inter, "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button, input { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  .app { display: grid; grid-template: 48px 1fr / 232px 1fr; height: 100vh; }

  /* top bar */
  .top { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: var(--rail); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; width: 204px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; }
  .tileicon { width: 28px; height: 28px; border-radius: 7px; background: var(--tile); display: grid; place-items: center; font: 700 13px/1 Inter, sans-serif; color: #7fe3ff; box-shadow: inset 0 0 0 1px rgba(127, 227, 255, .35); flex: none; }
  .search { flex: 1; max-width: 520px; margin: 0 auto; position: relative; }
  .search input { width: 100%; height: 30px; padding: 0 12px 0 32px; border-radius: 15px; border: 1px solid var(--line); background: var(--bg); outline: none; }
  .search input:focus { border-color: var(--accent); }
  .search svg { position: absolute; left: 11px; top: 8px; width: 14px; height: 14px; fill: var(--faint); }
  .conn { display: flex; align-items: center; gap: 7px; color: var(--dim); font-size: 12px; white-space: nowrap; }
  .conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .conn.on i { background: var(--good); box-shadow: 0 0 8px rgba(76, 209, 122, .6); }
  .conn.off i { background: var(--warn); }
  .iconbtn { width: 30px; height: 30px; border-radius: 6px; border: none; background: none; display: grid; place-items: center; cursor: pointer; color: var(--dim); }
  .iconbtn:hover { background: var(--panel); color: var(--text); }

  /* left rail */
  .rail { background: var(--rail); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; overflow: auto; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 17px; border: 1px solid var(--line2); background: var(--panel); cursor: pointer; font-weight: 500; white-space: nowrap; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent2); border-color: var(--accent2); color: #fff; font-weight: 600; }
  .btn.primary:hover { background: #3a9fe6; }
  .btn[disabled], .card[disabled] { opacity: .4; pointer-events: none; }
  .btn svg { width: 14px; height: 14px; fill: currentColor; }
  .rail .btn { margin-bottom: 6px; }
  .nav { margin-top: 14px; display: flex; flex-direction: column; gap: 2px; }
  .nav a { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border-radius: 6px; color: var(--dim); font-weight: 500; }
  .nav a svg { width: 16px; height: 16px; fill: currentColor; opacity: .85; }
  .nav a:hover { background: var(--panel); color: var(--text); }
  .nav a.on { background: var(--panel2); color: var(--text); }
  .rail .foot { margin-top: auto; color: var(--faint); font-size: 11px; padding: 10px 6px 0; border-top: 1px solid var(--line); }

  /* main */
  main { overflow: auto; padding: 26px 34px 40px; }
  .banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 8px; background: rgba(245, 197, 66, .08); border: 1px solid rgba(245, 197, 66, .3); color: #f2dda0; margin-bottom: 24px; max-width: 1100px; }
  .banner b { color: var(--warn); }
  .banner:empty { display: none; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 22px; }
  h2 { font-size: 14px; font-weight: 600; margin: 30px 0 12px; display: flex; align-items: baseline; gap: 10px; }
  h2 small { color: var(--faint); font-weight: 400; font-size: 12px; }
  .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; max-width: 1100px; }
  .card { position: relative; display: flex; flex-direction: column; text-align: left; padding: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); cursor: pointer; transition: border-color .15s, transform .15s; }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card .th { aspect-ratio: 16 / 10; background: #121418 center / cover no-repeat; display: grid; place-items: center; color: var(--faint); }
  .card .th svg { width: 30px; height: 30px; fill: currentColor; }
  .card .th .ini { font-size: 34px; font-weight: 600; color: #5f7d93; }
  .card .meta { padding: 9px 11px 10px; min-width: 0; }
  .card b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card small { color: var(--faint); font-size: 11.5px; }
  .card.make .th { background: linear-gradient(160deg, #2a2f37, #1d2026); }
  .card.make:hover .th { color: var(--accent); }
  .card.dashed { border-style: dashed; background: none; }
  .card .more { position: absolute; right: 6px; top: 6px; width: 26px; height: 26px; border-radius: 6px; border: none; background: rgba(20, 22, 25, .75); color: var(--text); display: none; place-items: center; cursor: pointer; }
  .card:hover .more { display: grid; }
  .card .tag { position: absolute; left: 8px; top: 8px; font-size: 10px; font-weight: 600; letter-spacing: .04em; padding: 2px 7px; border-radius: 4px; background: rgba(20, 22, 25, .8); color: #b9c4d0; }
  .empty { color: var(--faint); padding: 18px 0; }
  table { width: 100%; max-width: 1100px; border-collapse: collapse; }
  th { text-align: left; color: var(--faint); font-weight: 500; font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  td { padding: 8px 10px; border-bottom: 1px solid rgba(49, 53, 61, .6); }
  tr.item { cursor: pointer; }
  tr.item:hover td { background: var(--panel); }
  td .mini { width: 56px; height: 34px; border-radius: 4px; background: #121418 center / cover; display: inline-block; vertical-align: middle; margin-right: 10px; }
  td.dim { color: var(--dim); }
  .learn { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; max-width: 1100px; }
  .learn a { display: block; padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .learn a:hover { border-color: var(--accent); }
  .learn b { display: block; margin-bottom: 4px; }
  .learn span { color: var(--dim); }
  .keys { color: var(--dim); max-width: 1100px; line-height: 2; }
  kbd { font: 11px Inter, sans-serif; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line2); background: var(--panel); color: var(--text); }

  /* menus, dialog, drop, toast */
  .menu { position: fixed; z-index: 40; min-width: 170px; padding: 4px; border-radius: 8px; background: #2a2e35; border: 1px solid var(--line2); box-shadow: 0 12px 30px rgba(0, 0, 0, .45); }
  .menu button { display: block; width: 100%; text-align: left; padding: 7px 12px; border: none; background: none; border-radius: 5px; cursor: pointer; }
  .menu button:hover { background: var(--accent2); color: #fff; }
  .modal { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: rgba(0, 0, 0, .55); }
  .modal.on { display: grid; }
  .dlg { width: min(640px, calc(100% - 32px)); border-radius: 10px; background: var(--panel); border: 1px solid var(--line2); box-shadow: 0 30px 80px rgba(0, 0, 0, .55); overflow: hidden; }
  .dlg header { padding: 14px 18px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 14px; }
  .dlg .body { padding: 18px; display: grid; gap: 16px; }
  .dlg label.f { display: grid; gap: 6px; color: var(--dim); font-size: 12px; }
  .dlg input[type=text] { height: 34px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line2); background: var(--bg); outline: none; }
  .dlg input[type=text]:focus { border-color: var(--accent); }
  .tpls { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .tpl { position: relative; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: pointer; background: var(--bg); }
  .tpl input { position: absolute; opacity: 0; }
  .tpl .th { aspect-ratio: 16 / 9; background: #121418 center / cover; display: grid; place-items: center; color: var(--faint); }
  .tpl .th svg { width: 26px; height: 26px; fill: currentColor; }
  .tpl span { display: block; padding: 7px 10px; font-weight: 500; }
  .tpl small { display: block; padding: 0 10px 9px; color: var(--faint); font-size: 11px; }
  .tpl:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .dlg footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); background: #202329; }
  .drop { position: fixed; inset: 10px; z-index: 60; border: 2px dashed var(--accent); border-radius: 14px; display: none; place-items: center; background: rgba(27, 29, 34, .88); font-size: 18px; font-weight: 600; pointer-events: none; }
  .drop.on { display: grid; }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 70; padding: 10px 16px; border-radius: 8px; background: #2a2e35; border: 1px solid var(--line2); display: none; max-width: calc(100% - 32px); }
  .toast.on { display: block; }
  .toast.err { border-color: rgba(255, 93, 93, .5); color: #ff9c9c; }

  @media (max-width: 760px) {
    .app { grid-template: 48px auto 1fr / 1fr; }
    .rail { flex-direction: row; flex-wrap: wrap; align-items: center; padding: 8px 12px; border-right: none; border-bottom: 1px solid var(--line); }
    .rail .btn { margin: 0; flex: 1; }
    .nav { flex-direction: row; margin: 0; width: 100%; overflow-x: auto; scrollbar-width: none; }
    .nav::-webkit-scrollbar { display: none; }
    .nav a { white-space: nowrap; flex: none; padding: 0 10px; }
    .row { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .card .meta small { display: none; }
    .rail .foot, .search, .brand span { display: none; }
    .brand { width: auto; }
    main { padding: 20px 16px 40px; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
    "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js"
  }
}
</script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="tileicon">Ot</div><span>Open Tuna Studio</span></div>
    <label class="search"><svg viewBox="0 0 16 16"><path d="M6.5 1a5.5 5.5 0 0 1 4.4 8.8l3.7 3.7-1.1 1.1-3.7-3.7A5.5 5.5 0 1 1 6.5 1zm0 1.6a3.9 3.9 0 1 0 0 7.8 3.9 3.9 0 0 0 0-7.8z"/></svg><input id="q" type="search" placeholder="Search projects and demos" autocomplete="off"></label>
    <div class="conn" id="conn" title=""><i></i><span>Connecting…</span></div>
    <a class="iconbtn" href="#learn" title="Learn"><svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M8 1a7 7 0 1 1 0 14A7 7 0 0 1 8 1zm0 9.6a.9.9 0 1 0 0 1.8.9.9 0 0 0 0-1.8zM8 3.8c-1.5 0-2.6.9-2.7 2.3h1.5c.1-.6.5-.9 1.2-.9.6 0 1.1.4 1.1.9 0 .5-.3.8-.9 1.2-.7.4-1 .9-1 1.7v.3h1.5v-.2c0-.5.2-.7.8-1.1.7-.4 1.2-1 1.2-1.9 0-1.4-1.1-2.3-2.7-2.3z"/></svg></a>
  </header>

  <aside class="rail">
    <button class="btn primary" data-act="new"><svg viewBox="0 0 16 16"><path d="M7 2h2v5h5v2H9v5H7V9H2V7h5z"/></svg>New project</button>
    <button class="btn" data-act="open"><svg viewBox="0 0 16 16"><path d="M1.5 3h5l1.5 1.5h6.5v8.5h-13z"/></svg>Open…</button>
    <nav class="nav">
      <a href="#home" data-view="home"><svg viewBox="0 0 16 16"><path d="M8 1.5 1 7.3l1 1.2.9-.7V14h4v-4h2.2v4h4V7.8l.9.7 1-1.2z"/></svg>Home</a>
      <a href="#projects" data-view="projects"><svg viewBox="0 0 16 16"><path d="M1.5 2.5h5l1.5 1.5h6.5v9.5h-13zM3 6v6h10V6z"/></svg>Your projects</a>
      <a href="#demos" data-view="demos"><svg viewBox="0 0 16 16"><path d="M2 2.5h12v11H2zm4 3v5l4.5-2.5z"/></svg>Demos</a>
      <a href="#learn" data-view="learn"><svg viewBox="0 0 16 16"><path d="M1 3.5c2.6-.8 4.9-.6 7 .9 2.1-1.5 4.4-1.7 7-.9V13c-2.6-.7-4.9-.5-7 1-2.1-1.5-4.4-1.7-7-1z"/></svg>Learn</a>
    </nav>
    <div class="foot" id="foot">WebGPU · Chrome / Edge</div>
  </aside>

  <main id="main"></main>
</div>

<div class="modal" id="newdlg">
  <form class="dlg" id="newform">
    <header>New project</header>
    <div class="body">
      <label class="f">Name<input type="text" id="pname" placeholder="Untitled project" maxlength="60" autocomplete="off"></label>
      <div class="f" style="color:var(--dim);font-size:12px">Start from</div>
      <div class="tpls" id="tpls"></div>
    </div>
    <footer><button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn primary">Create</button></footer>
  </form>
</div>
<div class="drop" id="drop">Drop a .tuna file to open it</div>
<div class="toast" id="toast"></div>

<script type="module">
import { unpackTuna, openTunaFile, blankTuna } from './src/editor/project.js';
import { editorURL, playURL } from './src/project.js';
import { backendReady } from './src/backend.js';

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const ICON = {
  blank: '<svg viewBox="0 0 16 16"><path d="M7 2h2v5h5v2H9v5H7V9H2V7h5z"/></svg>',
  open: '<svg viewBox="0 0 16 16"><path d="M1.5 3h5l1.5 1.5h6.5v8.5h-13z"/></svg>',
  more: '<svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor"><path d="M2.5 6.5h3v3h-3zM6.5 6.5h3v3h-3zM10.5 6.5h3v3h-3z"/></svg>',
};
const state = { server: false, projects: [], demos: [], view: 'home', q: '' };

function toast(msg, err = false, ms = 4000) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = `toast on${err ? ' err' : ''}`;
  clearTimeout(toast.timer);
  if (ms) toast.timer = setTimeout(() => { t.className = 'toast'; }, ms);
}
function ago(sec) {
  const s = Date.now() / 1000 - sec;
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.round(s / 60)} min ago`;
  if (s < 86400) return `${Math.round(s / 3600)} h ago`;
  if (s < 86400 * 7) return `${Math.round(s / 86400)} d ago`;
  return new Date(sec * 1000).toLocaleDateString([], { dateStyle: 'medium' });
}
const thumbStyle = (p) => (p.thumb ? ` style="background-image:url('./${esc(p.thumb)}${p.mtime ? `?v=${p.mtime}` : ''}')"` : '');
const initial = (p) => (p.thumb ? '' : `<span class="ini">${esc((p.name || '?').trim().charAt(0).toUpperCase())}</span>`);
const match = (p) => !state.q || `${p.name} ${p.project}`.toLowerCase().includes(state.q);

// ---------------------------------------------------------------- data
async function load() {
  await backendReady; // the studio server, or the browser studio (sw.js) on a plain file host
  try {
    const r = await fetch('./__editor/projects', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    state.server = true;
    state.local = !!j.local;
    state.projects = j.projects ?? [];
    state.demos = j.demos ?? [];
  } catch {
    state.server = false;
    state.projects = [];
    try { state.demos = (await (await fetch('./demos/index.json', { cache: 'no-store' })).json()).demos; } catch { state.demos = []; }
  }
  // the static list carries the descriptions
  if (state.server) {
    try {
      const about = Object.fromEntries((await (await fetch('./demos/index.json', { cache: 'no-store' })).json()).demos.map((d) => [d.project, d.about]));
      for (const d of state.demos) d.about ??= about[d.project];
    } catch { /* no descriptions */ }
  }
  const c = $('#conn');
  c.className = `conn ${state.server ? 'on' : 'off'}`;
  c.querySelector('span').textContent = state.local ? 'In this browser' : state.server ? 'Studio server' : 'Offline';
  c.title = state.local ? 'No studio server here: projects are kept in this browser, and Save (Ctrl+S) in the editor writes your .tuna file'
    : state.server ? 'Connected: projects are saved on this studio server' : 'No studio server: projects can’t be created or opened here';
  for (const b of document.querySelectorAll('[data-act="new"], [data-act="open"]')) b.disabled = !state.server;
  render();
}

// ---------------------------------------------------------------- views
function banner() {
  const msgs = [];
  if (state.local) msgs.push('<b>Projects are kept in this browser.</b> Your real file is the <b>.tuna</b>: press <b>Ctrl+S</b> in the editor to save it, and keep / share that file. Clearing this site’s browser data removes the copies kept here.');
  if (!state.server) msgs.push('<b>Not connected to a studio server.</b> This copy is read-only: you can play the demos, but creating and opening projects needs the studio server — open your team’s studio address, or run <b>Open Editor</b> on your computer.');
  if (!navigator.gpu) msgs.push(`<b>No WebGPU here.</b> ${isSecureContext ? 'Use a current Chrome or Edge.' : 'Open the studio over https:// (or localhost).'}`);
  return msgs.length ? `<div class="banner"><div>${msgs.join('<br>')}</div></div>` : '';
}
function projectCard(p) {
  return `<button class="card" data-open="${esc(p.project)}" title="Open ${esc(p.name)}">
    <div class="th"${thumbStyle(p)}>${initial(p)}</div>
    <div class="meta"><b>${esc(p.name)}</b><small>Edited ${ago(p.mtime)}</small></div>
    <span class="more" data-more="${esc(p.project)}" title="More">${ICON.more}</span></button>`;
}
function demoCard(d, mode = 'play') {
  return `<button class="card" data-${mode}="${esc(d.project)}" title="${esc(d.about || d.name)}">
    <span class="tag">DEMO</span>
    <div class="th"${thumbStyle(d)}>${initial(d)}</div>
    <div class="meta"><b>${esc(d.name)}</b><small>${mode === 'copy' ? 'Start from this demo' : 'Play'}</small></div>
    <span class="more" data-more-demo="${esc(d.project)}" title="More">${ICON.more}</span></button>`;
}
function render() {
  const v = state.view, P = state.projects.filter(match), D = state.demos.filter(match);
  document.querySelectorAll('.nav a').forEach((a) => a.classList.toggle('on', a.dataset.view === v));
  let html = banner();
  if (v === 'home') {
    html += `<h1>Home</h1>
      <h2>Start something new</h2>
      <div class="row">
        <button class="card make" data-act="new"${state.server ? '' : ' disabled'}><div class="th">${ICON.blank}</div><div class="meta"><b>Blank project</b><small>Ocean, camera, empty timeline</small></div></button>
        ${D.map((d) => demoCard(d, state.server ? 'copy' : 'play')).join('')}
        <button class="card make dashed" data-act="open"${state.server ? '' : ' disabled'}><div class="th">${ICON.open}</div><div class="meta"><b>Open .tuna file…</b><small>Or drop one anywhere</small></div></button>
      </div>
      <h2>Recent <small>${state.server ? `${P.length} project${P.length === 1 ? '' : 's'}` : ''}</small></h2>
      ${P.length ? `<div class="row">${P.slice(0, 12).map(projectCard).join('')}</div>`
        : `<div class="empty">${state.server ? (state.q ? 'No match.' : 'No projects yet. Create one, or open a .tuna file.') : 'Your projects appear here when the studio server is connected.'}</div>`}`;
  } else if (v === 'projects') {
    html += `<h1>Your projects</h1>${P.length ? `<table><tr><th>Name</th><th>Edited</th><th>Project id</th></tr>${P.map((p) => `
      <tr class="item" data-open="${esc(p.project)}"><td><span class="mini"${thumbStyle(p)}></span>${esc(p.name)}</td><td class="dim">${ago(p.mtime)}</td><td class="dim">${esc(p.project)}</td></tr>`).join('')}</table>`
      : `<div class="empty">${state.server ? 'No projects yet.' : 'Not connected to a studio server.'}</div>`}`;
  } else if (v === 'demos') {
    html += `<h1>Demos</h1><div class="row">${D.map((d) => demoCard(d, 'play')).join('') || '<div class="empty">No demos.</div>'}</div>
      <p style="color:var(--dim);max-width:720px;margin-top:18px">Demos come with the studio. Click to play one; use ⋯ to start a project from it${state.server ? '' : ' (needs the studio server)'}.</p>`;
  } else {
    html += `<h1>Learn</h1><div class="learn">
      <a href="EDITOR.md" target="_blank" rel="noopener"><b>Editor guide</b><span>Timeline, layers, 3D models, creature paths, saving.</span></a>
      <a href="docs/projects-build-data.md" target="_blank" rel="noopener"><b>Projects, export &amp; data</b><span>.tuna files, Build site for customers, CMS / API data.</span></a>
      <a href="docs/deploy.md" target="_blank" rel="noopener"><b>Running the studio</b><span>Install it on your team’s server (HTTPS, password).</span></a>
      ${state.demos[0] ? `<a href="${playURL(state.demos[0].project)}" target="_blank" rel="noopener"><b>See what it can do</b><span>Play the ${esc(state.demos[0].name)} demo.</span></a>` : ''}
    </div>
    <h2>Shortcuts here</h2><div class="keys"><kbd>Ctrl</kbd> <kbd>O</kbd> open a .tuna · drop a .tuna anywhere to open it · in the editor: <kbd>Ctrl</kbd> <kbd>S</kbd> save, <kbd>Space</kbd> play, <kbd>1</kbd>/<kbd>2</kbd> Scene / Game</div>`;
  }
  $('#main').innerHTML = html;
}

// ---------------------------------------------------------------- actions
function menu(x, y, items) {
  closeMenu();
  const m = document.createElement('div');
  m.className = 'menu';
  for (const [label, fn] of items) {
    const b = document.createElement('button');
    b.textContent = label;
    b.addEventListener('click', () => { closeMenu(); fn(); });
    m.append(b);
  }
  document.body.append(m);
  const r = m.getBoundingClientRect();
  m.style.left = `${Math.min(x, innerWidth - r.width - 8)}px`;
  m.style.top = `${Math.min(y, innerHeight - r.height - 8)}px`;
  setTimeout(() => addEventListener('pointerdown', closeMenu, { once: true }), 0);
}
function closeMenu() { document.querySelector('.menu')?.remove(); }
const play = (id) => window.open(playURL(id), '_blank');

function openNew(from = '') {
  if (!state.server) return;
  const tpls = [{ project: '', name: 'Blank', about: 'Ocean, camera, empty timeline' }, ...state.demos];
  $('#tpls').innerHTML = tpls.map((d) => `<label class="tpl"><input type="radio" name="tpl" value="${esc(d.project)}"${d.project === from ? ' checked' : ''}>
    <div class="th"${thumbStyle(d)}>${d.project ? '' : ICON.blank}</div><span>${esc(d.name)}</span><small>${d.project ? 'Copy of the demo' : esc(d.about)}</small></label>`).join('');
  $('#pname').value = '';
  $('#newdlg').classList.add('on');
  setTimeout(() => $('#pname').focus(), 0);
}
const closeNew = () => $('#newdlg').classList.remove('on');

async function create(name, from) {
  toast(from ? 'Copying the demo…' : 'Creating…', false, 0);
  try {
    let slug;
    if (from) {
      const r = await fetch(`./__editor/project/new?from=${encodeURIComponent(from)}&name=${encodeURIComponent(name)}`, { method: 'POST', body: '' });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
      slug = j.project;
    } else slug = (await unpackTuna(blankTuna(name), name, { progress: (t) => toast(t, false, 0) })).slug;
    location.href = editorURL(slug);
  } catch (e) { toast(`Couldn’t create it: ${e.message}`, true, 8000); }
}
async function open(fileOrHandle) {
  if (!state.server) return toast('Opening a .tuna needs the studio server', true);
  toast(`Opening ${fileOrHandle.name}…`, false, 0);
  try { location.href = editorURL(await openTunaFile(fileOrHandle, { progress: (t) => toast(t, false, 0), warn: (m) => toast(m, true, 6000) })); }
  catch (e) { toast(`Couldn’t open ${fileOrHandle.name}: ${e.message}`, true, 8000); }
}
async function pick() {
  if (!state.server) return;
  if (window.showOpenFilePicker) {
    try {
      const [h] = await window.showOpenFilePicker({ types: [{ description: 'Open Tuna project', accept: { 'application/octet-stream': ['.tuna'] } }] });
      if (h) return open(h);
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  const input = Object.assign(document.createElement('input'), { type: 'file', accept: '.tuna' });
  input.addEventListener('change', () => { if (input.files[0]) open(input.files[0]); });
  input.click();
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act], [data-open], [data-play], [data-copy], [data-more], [data-more-demo]');
  if (!t) return;
  e.preventDefault();
  const d = t.dataset;
  if (d.more) {
    e.stopPropagation();
    return menu(e.clientX, e.clientY, [['Open in the editor', () => { location.href = editorURL(d.more); }], ['Preview', () => play(d.more)]]);
  }
  if (d.moreDemo) {
    e.stopPropagation();
    const items = [['Play', () => play(d.moreDemo)]];
    if (state.server) items.push(['New project from this demo…', () => openNew(d.moreDemo)]);
    if (state.server && !state.local) items.push(['Edit the original (team)', () => { location.href = editorURL(d.moreDemo); }]);
    return menu(e.clientX, e.clientY, items);
  }
  if (d.act === 'new') openNew();
  else if (d.act === 'open') pick();
  else if (d.act === 'close') closeNew();
  else if (d.open) location.href = editorURL(d.open);
  else if (d.play) play(d.play);
  else if (d.copy) openNew(d.copy);
});
$('#newform').addEventListener('submit', (e) => {
  e.preventDefault();
  const from = new FormData(e.target).get('tpl') || '';
  const name = $('#pname').value.trim() || (from ? `${state.demos.find((x) => x.project === from)?.name ?? 'Demo'} copy` : 'Untitled project');
  closeNew();
  create(name, from);
});
$('#newdlg').addEventListener('pointerdown', (e) => { if (e.target.id === 'newdlg') closeNew(); });
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeNew(); closeMenu(); }
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyO') { e.preventDefault(); pick(); }
});
$('#q').addEventListener('input', (e) => { state.q = e.target.value.trim().toLowerCase(); render(); });
const route = () => { state.view = ['home', 'projects', 'demos', 'learn'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home'; render(); };
addEventListener('hashchange', route);
let depth = 0;
addEventListener('dragenter', (e) => { if ([...e.dataTransfer.types].includes('Files')) { depth++; $('#drop').classList.add('on'); } });
addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; $('#drop').classList.remove('on'); } });
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => {
  e.preventDefault();
  depth = 0;
  $('#drop').classList.remove('on');
  const f = [...e.dataTransfer.files].find((x) => /\.tuna$/i.test(x.name));
  if (f) open(f); else if (e.dataTransfer.files.length) toast('Only .tuna project files open here', true);
});

route();
load();
</script>
</body>
</html>
